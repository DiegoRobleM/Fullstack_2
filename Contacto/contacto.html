<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Pastelería 1000 Sabores</title>

    <link rel="stylesheet" href="../globalstyle.css" />
    <link rel="stylesheet" href="../RegistroUsuario/registro.css" />
    <link rel="stylesheet" href="contacto.css" />
  </head>

  <body style="background-color: #fff5e1">
    <mi-navbar></mi-navbar>

    <main class="contenedor-registro">
      <div class="tarjeta-registro">
        <h2 class="titulo-registro">Contacto</h2>
        <p class="text-center text-muted mb-4">Pastelería 1000 Sabores</p>

        <form id="form-contacto">
          <div class="campo-grupo">
            <label for="correo-contacto" class="form-label">Dirección Mail</label>
            <input
              type="email"
              class="form-control"
              id="correo-contacto"
              placeholder="name@example.com"
              required
            />
          </div>

          <div class="campo-grupo">
            <label for="consulta-contacto" class="form-label">Ingrese su consulta</label>
            <textarea
              class="form-control"
              id="consulta-contacto"
              rows="6"
              placeholder="Escriba su consulta aquí..."
              required
            ></textarea>
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-registrar btn-zoom">
              Enviar consulta
            </button>
          </div>
        </form>
      </div>
    </main>

    <mi-footer></mi-footer>


    <script src="../componentes.js"></script>
    <script src="function.js"></script>
  </body>
</html>
