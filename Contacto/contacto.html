<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>

    <link rel="stylesheet" href="../globalstyle.css" />
    <link rel="stylesheet" href="contacto.css" />
  </head>

  <body style="background-color: #fff5e1">
    <mi-navbar></mi-navbar>

    <div class="tituloContacto">
      <center>
        <h1>CONTACTO</h1>
        <p>Pasteleria 1000 sabores</p>
      </center>
    </div>
    
    <main>
      <center>
        <div class="container">
          <div class="card shadow-sm p-4" style="width: 48rem">
            <form id="form-contacto">
              <div class="form-group mb-3">
                <label for="correo-contacto">Dirección Mail</label>

                <input
                  type="email"
                  class="form-control"
                  id="correo-contacto"
                  placeholder="name@example.com"
                  required
                />
              </div>
              <div class="form-group">
                <label for="consulta-contacto">Ingrese su consulta</label>

                <textarea
                  class="form-control"
                  id="consulta-contacto"
                  rows="13"
                  required
                ></textarea>

                <div class="d-flex justify-content-end mt-3">
                  <button type="submit" class="btn-pasteleria">
                    Enviar consulta
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </center>
    </main>

    <mi-footer></mi-footer>

    <script src="../componentes.js"></script>
    <script src="function.js"></script>
  </body>
</html>
