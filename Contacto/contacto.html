<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="contacto.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;1,300&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../globalstyle.css">
</head>

<body style="background-color: #fff5e1">
  <mi-navbar></mi-navbar>

  <div class="tituloContacto">
    <center>
      <h1>CONTACTO</h1>
      <p>Pasteleria 1000 sabores</p>
    </center>
  </div>

  <main>
    <center>
      <div class="container">
        <div class="card shadow-sm p-4" style="width: 48rem">
          <form>
            <div class="form-group mb-3">
              <label for="exampleFormControlInput1">Direccion Mail</label>
              <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
            </div>
            <div class="form-group">
              <label for="exampleFormControlTextarea1">Ingrese su Consulta</label>
              <textarea class="form-control" id="exampleFormControlTextarea1" rows="13"></textarea>

              <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="btn-pasteleria">
                  Enviar consulta
                </button>
              </div>

            </div>
          </form>
        </div>
      </div>
    </center>
  </main>

  <mi-footer></mi-footer>

  <script src="../footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="function.js"></script>
  <script src="../navbar.js" defer></script>
</body>

</html>
