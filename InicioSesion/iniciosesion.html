<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Pastelería 1000 Sabores</title>
  <link rel="stylesheet" href="../globalstyle.css">
  <link rel="stylesheet" href="../RegistroUsuario/registro.css">
</head>

<body style="background-color: #fff5e1">
  <mi-navbar></mi-navbar>

  <main class="contenedor-registro">
    <div class="tarjeta-registro">
      <h2 class="titulo-registro">Iniciar Sesión</h2>
      
      <form>
        <div class="campo-grupo">
          <label for="inputEmail" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="inputEmail" placeholder="Ingrese su correo electrónico">
        </div>
        <div class="campo-grupo">
          <label for="inputPassword" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="inputPassword" placeholder="Ingrese su contraseña">
        </div>
        <div class="campo-grupo mt-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck">
            <label class="form-check-label" for="gridCheck">
              Recordar mi cuenta
            </label>
          </div>
        </div>
        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-registrar btn-zoom">Iniciar Sesión</button>
          <a href="../RegistroUsuario/registro.html" class="text-center text-decoration-none mt-2 text-muted small">
            ¿No tienes cuenta? Regístrate aquí
          </a>
        </div>
      </form>
    </div>
  </main>

  <mi-footer></mi-footer>
  <script src="../componentes.js"></script>
  <script src="function.js"></script>
</body>

</html>
